name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Swift toolchain
        run: |
          # Swiftly 1.2 understands the explicit .0 in Swift 6.4.0 download URLs.
          # Homebrew's older Swiftly builds construct a URL that does not exist.
          swiftly_package="$RUNNER_TEMP/swiftly-1.2.0.pkg"
          curl --fail --location --retry 3 \
            https://download.swift.org/swiftly/darwin/swiftly-1.2.0.pkg \
            --output "$swiftly_package"
          echo "a1b48692b00ea6902957423473c87bee7c7f3e18c015a4a09317102f6820b987  $swiftly_package" | shasum -a 256 -c -
          pkgutil --check-signature "$swiftly_package"
          installer -pkg "$swiftly_package" -target CurrentUserHomeDirectory
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
          "$HOME/.swiftly/bin/swiftly" init --skip-install --assume-yes --no-modify-profile
          "$HOME/.swiftly/bin/swiftly" install --assume-yes

      - name: Record tool versions
        run: |
          source ./script/setup.sh
          swift --version
          xcodebuild -version

      - name: Test Debug and optimized Dev builds
        run: make check
